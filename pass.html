<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temp Pass · 臨時學生證</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(17,29,54,.88);--panel2:rgba(10,19,36,.92);--line:rgba(148,180,255,.14);--line2:rgba(148,180,255,.3);
 --text:#f2f6ff;--dim:#a5b4d4;--faint:#6d7ea6;--amber:#ffb224;--green:#2fd37f;--red:#ff5d55;--grad:linear-gradient(135deg,#ffc95e,#ff8a3d)}
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
html{color-scheme:dark}
body{font-family:'IBM Plex Sans','Noto Sans TC',sans-serif;color:var(--text);min-height:100vh;
 background:radial-gradient(1300px 640px at 92% -12%,rgba(75,139,255,.2),transparent 62%),linear-gradient(180deg,#0a1424,#070d18 60%,#081120)}
.mono{font-family:'IBM Plex Mono',monospace}.dim{color:var(--dim)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line2);
 background:rgba(8,14,26,.82);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-family:'Archivo','Noto Sans TC';font-weight:900;font-size:20px}
.logo{width:36px;height:36px;object-fit:contain;border-radius:11px}
.brand b{color:var(--amber)}.brand span{font-size:11px;color:var(--faint);letter-spacing:.25em;font-weight:500}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:13.5px;cursor:pointer;transition:.2s}
.btn.primary{background:var(--grad);color:#2a1800;box-shadow:0 10px 26px rgba(255,150,40,.3)}
.btn.green{background:linear-gradient(180deg,#5ce8a4,#1fb86b);color:#03230f}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim)}
.btn:active{transform:scale(.98)}
main{max-width:1100px;margin:0 auto;padding:26px 20px}
.card{position:relative;border-radius:22px;border:1px solid var(--line2);padding:22px;margin-bottom:18px;background:linear-gradient(180deg,var(--panel),var(--panel2))}
.card h3{font-family:'Archivo';font-size:16px;font-weight:800;margin-bottom:10px}
.card h3 span{color:var(--faint);font-weight:500;font-size:.78em;margin-left:8px}
.field{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.field label{font-size:13px;color:var(--dim);font-weight:600}
.field input{background:rgba(0,0,0,.32);border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:11px 14px;font-size:16px;outline:none}
.field input:focus{border-color:var(--amber)}
.cands{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cand{border:1px solid var(--line);border-radius:12px;padding:9px 14px;background:rgba(255,255,255,.03);cursor:pointer;color:var(--text);font-size:13.5px}
.cand:hover{border-color:var(--amber)}
.prevwrap{background:#fff;border-radius:16px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
#cardCanvas{width:100%;height:auto;display:block;border-radius:6px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(23,37,66,.96);border:1px solid var(--amber);color:var(--text);padding:13px 24px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img class="logo" src="logo.png" onerror="this.style.display='none'" alt="">TEMP P<b>A</b>SS<span>臨時學生證</span></div>
  <button class="btn ghost" data-signout>Sign Out 登出</button>
</header>
<main>
  <section class="card">
    <h3>Student Lookup<span>輸入班別+學號 或 學生編號</span></h3>
    <div class="field">
      <label>Student 學生 <input type="text" id="pQ" placeholder="e.g. 1A01 / 1A 01 / 25001" style="min-width:240px"></label>
      <button class="btn primary" id="btnLook">Lookup 顯示</button>
    </div>
    <div class="cands" id="candList"></div>
  </section>
  <section class="card">
    <h3>Card Text<span>證面文字（可改）</span></h3>
    <div class="field">
      <label>Event 中文 <input type="text" id="evZh" style="min-width:160px"></label>
      <label>Event EN <input type="text" id="evEn" style="min-width:160px"></label>
      <label>Valid Until <input type="text" id="vUntil" style="width:150px"></label>
    </div>
  </section>
  <section class="card">
    <h3>Preview & Download<span>預覽與下載</span></h3>
    <div class="prevwrap"><canvas id="cardCanvas" width="2000" height="1200"></canvas></div>
    <div class="field"><button class="btn green" id="btnDl">Download PNG 下載 PNG</button><span class="dim" id="dlHint">2000×1200 px（約 300DPI 列印）</span></div>
  </section>
</main>
<canvas id="qrCanvas" style="display:none"></canvas>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let students={},booted=false,current=null,logoImg=null,qrReady=false;
const $=id=>document.getElementById(id);
const W=2000,H=1200;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);}

requireAuth(function(){
  if(booted)return;booted=true;
  bindSignOut();
  db.ref('students').on('value',s=>{students=s.val()||{};});
  watchScenario(v=>{
    if(!$('evZh').dataset.touched)$('evZh').value=scenarioMeta(v).zh;
    if(!$('evEn').dataset.touched)$('evEn').value=scenarioMeta(v).en;
    redraw();
  });
  $('evZh').value='陸運會';$('evEn').value='Sports Day';$('vUntil').value='2099-12-31';
  ['evZh','evEn','vUntil'].forEach(id=>{
    $(id).addEventListener('input',()=>{ $(id).dataset.touched='1'; redraw(); });
  });
  bindKeypadInput($('pQ'),{title:'Student<span>班別+學號 / 學生編號</span>'});
  $('btnLook').onclick=()=>lookup($('pQ').value);
  $('pQ').addEventListener('keydown',e=>{if(e.key==='Enter')lookup($('pQ').value);});
  $('btnDl').onclick=download;

  // logo
  logoImg=new Image();
  logoImg.onload=()=>redraw();
  logoImg.src='logo.png';

  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>redraw());
  redraw();

  function lookup(q){
    q=String(q||'').trim().toUpperCase();
    $('candList').innerHTML='';
    if(!q)return;
    let list=[];
    if(students[q])list=[students[q]];
    else list=Object.values(students).filter(s=>String(s.sid||'').toUpperCase()===q);
    if(!list.length){
      const m=q.match(/^([0-9]+[A-Z]+)[\s\-]?([0-9]+)$/);
      if(m)list=Object.values(students).filter(s=>String(s.cls||'').toUpperCase()===m[1]&&String(parseInt(s.no,10)||s.no)===String(parseInt(m[2],10)));
    }
    if(!list.length){toast('Not found 查無此人');return;}
    if(list.length===1){setSt(list[0]);return;}
    $('candList').innerHTML=list.slice(0,12).map(s=>`<button class="cand" data-sid="${esc(s.sid)}">${esc(s.name||'—')} · ${esc(s.cls)} ${esc(s.no)} · ${esc(s.sid)}</button>`).join('');
    $('candList').querySelectorAll('[data-sid]').forEach(b=>b.onclick=()=>{setSt(students[b.dataset.sid]);$('candList').innerHTML='';});
  }
  function setSt(st){current=st;redraw();toast(`${st.name||st.sid} 已載入`);}

  async function redraw(){
    const cv=$('cardCanvas'),ctx=cv.getContext('2d');
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
    // cut border
    ctx.strokeStyle='#dddddd';ctx.lineWidth=4;ctx.strokeRect(6,6,W-12,H-12);
    const st=current;
    // logo box
    const LX=80,LY=60,LS=210;
    if(logoImg&&logoImg.complete&&logoImg.naturalWidth>0){ ctx.drawImage(logoImg,LX,LY,LS,LS); }
    else{ ctx.fillStyle='#000';ctx.fillRect(LX,LY,LS,LS);ctx.fillStyle='#fff';ctx.textAlign='center';
      ctx.font='700 70px "Archivo",sans-serif';ctx.fillText('LO',LX+LS/2,LY+90);ctx.fillText('GO',LX+LS/2,LY+165);ctx.textAlign='left'; }
    // title
    ctx.fillStyle='#111111';
    ctx.font='700 76px "Noto Sans TC",sans-serif';
    ctx.fillText(`${$('evZh').value||''}臨時進出憑證`, LX+LS+50, LY+95);
    ctx.font='500 54px "IBM Plex Sans","Noto Sans TC",sans-serif';
    ctx.fillText(`${$('evEn').value||''} Temporary Entry/Exit Pass`, LX+LS+50, LY+170);
    ctx.font='500 60px "IBM Plex Sans",sans-serif';
    ctx.fillText(`Valid Until: ${$('vUntil').value||''}`, LX, LY+LS+115);
    if(!st){
      ctx.fillStyle='#999';ctx.font='500 60px "Noto Sans TC",sans-serif';
      ctx.fillText('請先輸入班別+學號或學生編號', LX, 700);
      return;
    }
    // house box
    const HX=80,HY=700,HS=380;
    ctx.fillStyle='#000';ctx.fillRect(HX,HY,HS,HS);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 250px "Archivo",sans-serif';
    ctx.fillText(String(st.house||'?'),HX+HS/2,HY+HS/2+88);ctx.textAlign='left';
    // info
    ctx.fillStyle='#111';
    ctx.font='600 84px "IBM Plex Sans",sans-serif';
    ctx.fillText(`${st.cls||''} ${st.no||''}`, HX+HS+60, HY+110);
    ctx.font='700 112px "Noto Sans TC",sans-serif';
    ctx.fillText(st.name||'—', HX+HS+60, HY+245);
    ctx.font='600 64px "Archivo","IBM Plex Sans",sans-serif';
    ctx.fillText(String(st.ename||'').toUpperCase(), HX+HS+60, HY+345);
    // QR
    const QS=520,QX=W-QS-80,QY=H-QS-80;
    try{
      const qc=$('qrCanvas');
      await QRCode.toCanvas(qc,String(st.sid),{margin:1,width:1024,color:{dark:'#000000',light:'#ffffff'}});
      ctx.fillStyle='#fff';ctx.fillRect(QX-16,QY-16,QS+32,QS+32);
      ctx.drawImage(qc,QX,QY,QS,QS);
    }catch(e){ ctx.fillStyle='#000';ctx.fillRect(QX,QY,QS,QS);ctx.fillStyle='#fff';ctx.font='700 60px "Archivo",sans-serif';ctx.textAlign='center';ctx.fillText('QR',QX+QS/2,QY+QS/2);ctx.textAlign='left'; }
  }

  function download(){
    if(!current){toast('請先載入學生');return;}
    $('cardCanvas').toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=`${current.sid}_pass.png`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      toast('PNG 已下載');
    },'image/png');
  }
});
</script>
</body>
</html>
