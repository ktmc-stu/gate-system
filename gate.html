<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gate · 閘口</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#081120;--panel:rgba(17,29,54,.86);--panel2:rgba(10,19,36,.9);--line:rgba(148,180,255,.14);--line2:rgba(148,180,255,.28);
 --text:#f2f6ff;--dim:#a5b4d4;--faint:#6d7ea6;--amber:#ffb224;--amber-d:#ff8a3d;--green:#2fd37f;--red:#ff5d55;--blue:#4b8bff;--shadow:0 20px 60px rgba(2,8,20,.55)}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{font-family:'IBM Plex Sans','Noto Sans TC',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;
 background:radial-gradient(1200px 600px at 85% -10%,rgba(75,139,255,.18),transparent 60%),radial-gradient(1000px 600px at -10% 110%,rgba(255,178,36,.14),transparent 60%),linear-gradient(180deg,#0a1424,#070d18 60%,#081120)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
 background-image:linear-gradient(rgba(160,190,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(160,190,255,.05) 1px,transparent 1px);
 background-size:44px 44px;mask-image:radial-gradient(ellipse 90% 70% at 50% 35%,#000 20%,transparent 75%)}
body::after{content:'';position:fixed;left:0;right:0;height:220px;top:-240px;pointer-events:none;z-index:0;
 background:linear-gradient(180deg,transparent,rgba(120,170,255,.07),transparent);animation:sweep 11s linear infinite}
@keyframes sweep{to{transform:translateY(calc(100vh + 480px))}}
.mono{font-family:'IBM Plex Mono',monospace}.dim{color:var(--dim)}
::selection{background:rgba(255,178,36,.35)}
.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(8,14,26,.72);backdrop-filter:blur(14px)}
.gsign{display:flex;align-items:center;gap:12px;font-family:'Archivo','Noto Sans TC';font-weight:900;font-size:22px;letter-spacing:.08em}
.gsign::before{content:'G';display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--amber-d));color:#241500;font-size:20px;box-shadow:0 6px 18px rgba(255,150,40,.35)}
.gsign b{color:var(--amber);font-weight:800}
.gsign .zh{font-size:12px;color:var(--faint);letter-spacing:.3em;font-weight:500}
.led{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:led 2.2s infinite}
@keyframes led{50%{opacity:.4}}
.gmid{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modebadge{font:600 11px 'IBM Plex Mono';letter-spacing:.12em;padding:7px 14px;border-radius:99px;color:var(--amber);border:1px solid rgba(255,178,36,.35);background:rgba(255,178,36,.1)}
.conn{display:flex;align-items:center;gap:7px;font:600 11px 'IBM Plex Mono';letter-spacing:.1em;color:var(--faint)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.on{color:var(--green)}.conn.on i{background:var(--green);box-shadow:0 0 10px var(--green)}
.conn.off{color:var(--red)}.conn.off i{background:var(--red)}
.gright{display:flex;align-items:center;gap:14px}
.nowout{font:600 11px 'IBM Plex Mono';letter-spacing:.12em;color:var(--dim)}
.nowout b{color:var(--amber);font-size:17px;margin-left:4px}
.clock{font-family:'IBM Plex Mono';font-weight:600;font-size:20px;letter-spacing:.06em}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);font-size:17px;cursor:pointer;transition:.2s}
.iconbtn:hover{color:var(--amber);border-color:rgba(255,178,36,.5);transform:rotate(30deg)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:2}
.board{width:min(1020px,96vw);min-height:min(600px,76vh);position:relative;display:flex;flex-direction:column;justify-content:center;gap:24px;
 padding:clamp(26px,4.5vw,52px);border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));
 box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(16px);overflow:hidden}
.board::before{content:'';position:absolute;inset:-40%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,178,36,.06) 78%,transparent 86%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.board>*{position:relative;animation:up .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.micro{font:600 11px 'IBM Plex Mono';letter-spacing:.3em;color:var(--faint)}
.ready-word{font-family:'Archivo','Noto Sans TC';font-weight:900;font-size:clamp(60px,12vw,140px);line-height:1;text-shadow:0 0 40px rgba(255,178,36,.25)}
.cursor{display:inline-block;width:.42em;height:.8em;background:linear-gradient(180deg,var(--amber),var(--amber-d));margin-left:.12em;border-radius:4px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ready-sub{font-size:clamp(17px,2.2vw,23px);font-weight:600;color:var(--dim)}
.ready-sub .zh{color:var(--faint);font-size:.82em;margin-left:10px}
.chev{display:flex;gap:10px;font-size:26px;color:var(--amber)}
.chev span{animation:chev 1.3s infinite}
.chev span:nth-child(2){animation-delay:.16s}.chev span:nth-child(3){animation-delay:.32s}
@keyframes chev{0%,60%,100%{opacity:.12;transform:translateX(0)}30%{opacity:1;transform:translateX(4px)}}
.ready-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font:600 12px 'IBM Plex Mono';letter-spacing:.06em;color:var(--dim);border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:99px;padding:9px 15px}
.pill b{color:var(--text)}
.ghostbtn{border:1px dashed var(--line2);background:none;color:var(--dim);border-radius:99px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.ghostbtn:hover{color:var(--amber);border-color:var(--amber);background:rgba(255,178,36,.08)}
.grid2{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,44px);align-items:center}
@media(max-width:680px){.grid2{grid-template-columns:1fr;justify-items:center}.info{width:100%}}
.house{width:clamp(150px,20vw,215px);aspect-ratio:1;border-radius:24px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
 box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -14px 30px rgba(0,0,0,.25);animation:houseIn .5s cubic-bezier(.2,1.4,.4,1)}
.house::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.35),transparent 45%)}
@keyframes houseIn{from{transform:scale(.55) rotate(-6deg);opacity:0}}
.house .hl{font-family:'Archivo';font-weight:900;font-size:clamp(80px,12vw,130px);line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.3)}
.house .hs{font:700 12px 'IBM Plex Mono';letter-spacing:.4em;opacity:.9;margin-top:8px}
.info{display:grid;gap:2px;min-width:0}
.row{display:flex;justify-content:space-between;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row .k{color:var(--dim);font-size:14px}.row .k i{font-style:normal;color:var(--faint);font-size:.85em;margin-left:6px}
.row .v{font-weight:700;font-size:clamp(16px,2vw,20px)}
.row .v.small{font-size:13px;color:var(--dim);font-weight:500}
.flagline{margin-top:14px;border:1.5px solid var(--amber);color:var(--amber);background:rgba(255,178,36,.12);border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;animation:flash 1.4s infinite}
@keyframes flash{50%{opacity:.55}}
.stamp{position:absolute;top:clamp(16px,3vw,32px);right:clamp(18px,3vw,36px);z-index:3;font-family:'Archivo';font-weight:900;
 font-size:clamp(34px,5.5vw,56px);letter-spacing:.08em;padding:8px 22px;border:5px solid currentColor;border-radius:16px;transform:rotate(-8deg);
 background:rgba(8,14,26,.55);backdrop-filter:blur(4px);animation:stampIn .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(2.2);opacity:0}}
.s-out{color:var(--amber);box-shadow:0 0 40px rgba(255,178,36,.25)}
.s-in{color:var(--green);box-shadow:0 0 40px rgba(47,211,127,.25)}
.s-warn{color:var(--red);box-shadow:0 0 40px rgba(255,93,85,.25)}
.alert{border:1.5px solid var(--red);background:rgba(255,93,85,.14);color:#ffd9d7;border-radius:16px;padding:16px 20px;font-weight:800;font-size:clamp(15px,2vw,19px);animation:flash 1.1s infinite}
.okline{color:var(--green);font-weight:700;letter-spacing:.05em}
.dur-line{font-family:'Archivo';font-weight:900;font-size:clamp(30px,4.5vw,46px);margin-top:10px}
.dur-line span{display:block;font:600 11px 'IBM Plex Mono';letter-spacing:.25em;color:var(--faint);margin-top:6px}
.warn-title{font-family:'Archivo';font-weight:900;font-size:clamp(24px,3.4vw,36px);color:var(--red);margin-top:8px}
.warn-title span{display:block;font-size:.5em;font-weight:500;font-family:'Noto Sans TC';color:var(--dim);margin-top:6px}
.nf{font-family:'Archivo';font-weight:900;font-size:clamp(28px,4.5vw,46px)}
.nf span{display:block;font-size:.42em;font-weight:500;color:var(--dim);margin-top:8px}
.center{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.act{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.act{grid-template-columns:1fr}}
.bigbtn{border:0;border-radius:20px;cursor:pointer;padding:clamp(20px,3vw,30px);font-family:'Archivo','Noto Sans TC';font-weight:900;
 font-size:clamp(24px,3.4vw,38px);letter-spacing:.03em;transition:transform .12s,filter .2s}
.bigbtn span{display:block;font-size:.46em;font-weight:700;letter-spacing:.2em;opacity:.85;margin-top:6px}
.bigbtn:active{transform:scale(.97)}
.bigbtn:hover{filter:brightness(1.06)}
.bigbtn.out{background:linear-gradient(180deg,#ffc95e,#ff9a2e);color:#2a1800;box-shadow:0 14px 40px rgba(255,150,40,.35)}
.bigbtn.in{background:linear-gradient(180deg,#5ce8a4,#1fb86b);color:#03230f;box-shadow:0 14px 40px rgba(47,211,127,.3)}
.foot-hint{font-size:12px;color:var(--faint);text-align:center;letter-spacing:.12em}
#scan{position:fixed;left:6px;bottom:6px;width:2px;height:2px;opacity:.01;border:0;background:transparent}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(410px,94vw);z-index:60;padding:28px;overflow:auto;background:rgba(10,18,34,.92);
 backdrop-filter:blur(20px);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .3s cubic-bezier(.3,1,.4,1)}
.drawer.open{transform:none;box-shadow:-40px 0 90px rgba(0,0,0,.6)}
.drawer h2{font-family:'Archivo';font-size:22px;font-weight:800}
.drawer h2 span{font-size:.6em;color:var(--faint);font-weight:500;margin-left:8px}
.drawer label{display:block;margin:18px 0 8px;font-size:13px;color:var(--dim);font-weight:600}
.drawer input[type=text]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--text);font-size:15px;outline:none;transition:.2s}
.drawer input[type=text]:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,178,36,.15)}
.mode{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer;transition:.2s;background:rgba(255,255,255,.02)}
.mode:has(input:checked){border-color:rgba(255,178,36,.6);background:rgba(255,178,36,.08)}
.mode input{margin-top:3px;accent-color:var(--amber)}
.mode b{display:block;font-size:14px}.mode span{font-size:12px;color:var(--faint)}
.note{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--faint);line-height:1.7}
.drawer-btns{display:flex;gap:10px;margin-top:24px}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:14px;cursor:pointer;transition:.2s}
.btn.primary{background:linear-gradient(180deg,#ffc95e,#ff9a2e);color:#2a1800;flex:1;box-shadow:0 10px 26px rgba(255,150,40,.3)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--dim)}
.btn.ghost:hover{color:var(--red);border-color:var(--red)}
.xbtn{background:none;border:0;color:var(--faint);font-size:18px;cursor:pointer}
.xbtn:hover{color:var(--text)}
.overlay{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(4,8,16,.7);backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.pad{width:min(390px,94vw);border-radius:24px;padding:24px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(23,37,66,.95),rgba(10,19,36,.95));box-shadow:var(--shadow);animation:up .3s ease}
.pad-head{display:flex;justify-content:space-between;align-items:center;font-family:'Archivo';font-weight:800;font-size:18px}
.pad-head span{font-size:.65em;color:var(--faint);font-weight:500;margin-left:6px}
.pad-disp{margin:16px 0 6px;min-height:56px;display:flex;align-items:center;padding:0 16px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line2);font-size:24px;letter-spacing:.12em}
.pad-hint{font-size:12px;color:var(--faint);margin-bottom:14px}
.pad-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad-keys button{padding:16px 0;font-size:20px;font-weight:700;border-radius:14px;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);transition:.15s}
.pad-keys button:active{background:var(--amber);color:#241500;border-color:var(--amber)}
.pad .go{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(180deg,#5ce8a4,#1fb86b);color:#03230f;font-weight:900;font-size:16px;letter-spacing:.06em}
</style>
</head>
<body>

<header class="top">
  <div class="gsign"><span class="led"></span>GATE&nbsp;<b id="gShow">—</b><span class="zh">閘口</span></div>
  <div class="gmid">
    <span class="modebadge" id="scBadge" style="color:var(--green);border-color:var(--green);background:rgba(55,201,120,.08)">—</span>
    <span class="modebadge" id="modeBadge">—</span>
    <span class="conn" id="conn"><i></i><span id="connTx">…</span></span>
  </div>
  <div class="gright"><span class="nowout">NOW OUTSIDE 正在外面 <b id="nowOut">0</b></span><time class="clock mono" id="clock">--:--:--</time><button class="iconbtn" id="btnSet" title="Settings 設定">⚙</button></div>
</header>

<main><section class="board" id="board"></section></main>

<input id="scan" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true">

<aside class="drawer" id="drawer">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <h2>Gate Settings<span>閘口設定</span></h2><button class="xbtn" id="drawerClose">✕</button>
  </div>
  <label>Gate Name 閘口名稱</label>
  <input type="text" id="gName" maxlength="24" placeholder="e.g. Stand Exit A">
  <label style="margin-top:22px">Mode 模式</label>
  <label class="mode"><input type="radio" name="gmode" value="dual"><div><b>Dual Mode 雙模式</b><span>One device · choose after swipe 拍卡後手動揀「外出／返回」</span></div></label>
  <label class="mode"><input type="radio" name="gmode" value="out"><div><b>OUT Only 只登記外出</b><span>Registers students leaving the zone 只處理離開（往廁所／小食部）</span></div></label>
  <label class="mode"><input type="radio" name="gmode" value="in"><div><b>IN Only 只登記返回</b><span>Registers students returning 只處理返回看台／場館</span></div></label>
  <label class="mode" style="margin-top:16px"><input type="checkbox" id="gSound"><div><b>Sound 聲音提示</b><span>Beep on swipe 拍卡嗶聲</span></div></label>
  <div class="note">Overlong threshold 超時時限：<b><span id="thNote">15</span> min</b>（於 Admin 管理頁設定 set in Admin）<br>Event scenario 活動場景由 Admin 統一設定。</div>
  <div class="drawer-btns"><button class="btn primary" id="saveCfg">Save 儲存</button><button class="btn ghost" data-signout>Sign Out 登出</button></div>
</aside>

<div class="overlay" id="padOv">
  <div class="pad">
    <div class="pad-head"><div>Manual Entry<span>手動輸入</span></div><button class="xbtn" id="padClose">✕</button></div>
    <div class="pad-disp mono" id="padVal">&nbsp;</div>
    <div class="pad-hint">Enter Card No. or Student ID, then Confirm 輸入卡號或學生編號後按確定</div>
    <div class="pad-keys" id="padKeys"></div>
    <button class="go" id="padGo">CONFIRM 確定</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
const CFG_KEY='gate.cfg.v1';
let cfg={name:'Main Gate',mode:'dual',muted:false};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(CFG_KEY)||'{}'))}catch(e){}
window.MUTED=cfg.muted;
let threshold=15, scenario='track', students={}, liveMap={}, state='boot', pendingSt=null, resetT=null, booted=false;
const $=id=>document.getElementById(id), board=$('board');

requireAuth(function init(){
  if(booted)return; booted=true;
  bindSignOut();
  applyHeader(); toReady();
  setInterval(()=>{$('clock').textContent=fmtClock(Date.now())},500);

  db.ref('students').on('value',s=>{students=s.val()||{}; if(state==='ready')renderReady();});
  db.ref('live').on('value',s=>{liveMap=s.val()||{}; $('nowOut').textContent=Object.keys(liveMap).length; if(state==='ready')renderReady();});
  db.ref('.info/connected').on('value',s=>{const on=!!s.val();$('conn').className='conn '+(on?'on':'off');$('connTx').textContent=on?'LIVE 連線':'OFFLINE 離線';});
  watchThreshold(v=>{threshold=v;$('thNote').textContent=v;});
  watchScenario(v=>{scenario=v;applyHeader();if(state==='ready')renderReady();});

  /* ---- 常態化焦點：拍卡機 = 鍵盤，任何時候打字都收到 ---- */
  const scan=$('scan');
  function focusScan(){ if(!$('padOv').classList.contains('open') && !$('drawer').classList.contains('open')) scan.focus({preventScroll:true}); }
  scan.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();const v=scan.value;scan.value='';handleScan(v);} });
  scan.addEventListener('blur',()=>setTimeout(focusScan,80));
  document.addEventListener('click',()=>setTimeout(focusScan,60));

  /* ---- header / drawer ---- */
  $('btnSet').onclick=()=>{ $('gName').value=cfg.name; document.querySelector(`input[name=gmode][value=${cfg.mode}]`).checked=true; $('gSound').checked=!cfg.muted; $('drawer').classList.add('open'); };
  $('drawerClose').onclick=()=>$('drawer').classList.remove('open');
  $('saveCfg').onclick=()=>{
    cfg.name=$('gName').value.trim()||'Main Gate';
    cfg.mode=document.querySelector('input[name=gmode]:checked').value;
    cfg.muted=!$('gSound').checked; window.MUTED=cfg.muted;
    localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
    applyHeader(); $('drawer').classList.remove('open'); toReady();
  };
  function applyHeader(){
    $('gShow').textContent=cfg.name;
    $('modeBadge').textContent= cfg.mode==='dual' ? 'DUAL 雙模式' : cfg.mode==='out' ? 'OUT ONLY 只登記外出' : 'IN ONLY 只登記返回';
    const sc=scenarioMeta(scenario);
    $('scBadge').textContent=`${sc.zh} ${sc.en.toUpperCase()}`;
  }

  /* ---- manual pad ---- */
  let padBuf='';
  const keys=['1','2','3','4','5','6','7','8','9','CLR','0','⌫'];
  keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.dataset.k=k==='CLR'?'clr':k==='⌫'?'bk':k;$('padKeys').appendChild(b);});
  $('padKeys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
    if(k==='clr')padBuf=''; else if(k==='bk')padBuf=padBuf.slice(0,-1); else if(padBuf.length<24)padBuf+=k; updPad();});
  function updPad(){$('padVal').textContent=padBuf||'\u00a0';}
  function openPad(){padBuf='';updPad();$('padOv').classList.add('open');}
  function closePad(){$('padOv').classList.remove('open');focusScan();}
  $('padClose').onclick=closePad;
  $('padGo').onclick=()=>{const q=padBuf;closePad();if(q)handleScan(q);};
  document.addEventListener('keydown',e=>{ if(!$('padOv').classList.contains('open'))return;
    if(/^[0-9a-zA-Z]$/.test(e.key)&&padBuf.length<24){padBuf+=e.key;updPad();}
    else if(e.key==='Backspace'){padBuf=padBuf.slice(0,-1);updPad();e.preventDefault();}
    else if(e.key==='Enter'){$('padGo').click();}
    else if(e.key==='Escape')closePad();});

  /* ---- 拍卡主流程 ---- */
  function findStudent(q){
    q=String(q||'').trim().toUpperCase(); if(!q)return null;
    if(students[q])return students[q];
    for(const k in students){ if(String(students[k].sid||'').toUpperCase()===q) return students[k]; }
    return null;
  }
  function handleScan(raw){
    raw=String(raw||'').trim(); if(!raw)return;
    const st=findStudent(raw);
    if(!st){showNotFound(raw);return;}
    if(cfg.mode==='out')doOut(st); else if(cfg.mode==='in')doIn(st); else showChoice(st);
  }

  function doOut(st){
    const card=st.card, now=Date.now();
    if(liveMap[card]){showWarn(st,'ALREADY OUT','該學生已登記外出，尚未返回',liveMap[card]);return;}
    const recKey=db.ref('records').push().key;
    db.ref('live/'+card).transaction(cur=>{
      if(cur)return; // 已有外出記錄 → 中止
      return {recordId:recKey,outAt:now,gate:cfg.name};
    }).then(res=>{
      if(!res.committed){showWarn(st,'ALREADY OUT','該學生已登記外出，尚未返回',liveMap[card]||{outAt:now});return;}
      db.ref('records/'+recKey).set({card,sid:st.sid,cls:st.cls,no:st.no,house:st.house,scenario,gateOut:cfg.name,outAt:now,gateIn:null,inAt:null,durationSec:null,overlong:false});
      db.ref('counters/'+card+'/outCount').transaction(v=>(v||0)+1).then(r=>{
        showOut(st, r.snapshot.val()||1, !!st.overlongFlag);
      });
    });
  }
  function doIn(st){
    const card=st.card; let captured=null;
    db.ref('live/'+card).transaction(cur=>{
      if(!cur)return; captured=cur; return null; // 清除外出狀態
    }).then(res=>{
      if(!res.committed||!captured){showWarn(st,'NO OUT RECORD','沒有外出記錄 — 該學生未有登記離開',null);return;}
      const now=Date.now(), durMs=Math.max(0,now-captured.outAt), over=durMs>=threshold*60000;
      const upd={};
      upd['records/'+captured.recordId+'/inAt']=now;
      upd['records/'+captured.recordId+'/gateIn']=cfg.name;
      upd['records/'+captured.recordId+'/durationSec']=Math.round(durMs/1000);
      upd['records/'+captured.recordId+'/overlong']=over;
      if(over)upd['students/'+card+'/overlongFlag']=true;
      db.ref().update(upd).then(()=>showIn(st,durMs,over));
    });
  }

  /* ---- 畫面 ---- */
  const houseBlock=st=>{const m=houseMeta(st.house);
    return `<div class="house" style="background:${m.color};color:${m.text}"><span class="hl">${esc(st.house||'?')}</span><span class="hs">HOUSE 社</span></div>`;};
  const rows=st=>`
    <div class="row"><span class="k">Student ID<i>學生編號</i></span><span class="v mono">${esc(st.sid||'—')}</span></div>
    <div class="row"><span class="k">Class<i>班別</i></span><span class="v">${esc(st.cls||'—')}</span></div>
    <div class="row"><span class="k">Class Number<i>學號</i></span><span class="v">${esc(st.no||'—')}</span></div>
    <div class="row"><span class="k">Card No.<i>卡號</i></span><span class="v mono small">${esc(st.card)}</span></div>`;
  const flagBadge=st=>st.overlongFlag?`<div class="flagline">⚠ PREVIOUSLY OVERLONG 曾外出時間過長</div>`:'';
  function schedule(ms){clearTimeout(resetT);resetT=setTimeout(toReady,ms);}
  function toReady(){state='ready';pendingSt=null;clearTimeout(resetT);renderReady();}
  function renderReady(){
    if(state!=='ready')return;
    const sc=scenarioMeta(scenario);
    const n=Object.keys(liveMap).length;
    board.innerHTML=`
      <div class="micro">EVENT PASS TERMINAL · ${sc.en.toUpperCase()} ${sc.zh} · 拍卡就緒</div>
      <div class="ready-word">READY<span class="cursor"></span></div>
      <div class="ready-sub">Present student card<span class="zh">請拍卡</span></div>
      <div class="chev"><span>≫</span><span>≫</span><span>≫</span></div>
      <div class="ready-foot">
        <span class="pill">${sc.in.zh} → ${sc.out.zh} 外出登記</span>
        <span class="pill">NOW OUTSIDE 正在外面 <b>${n}</b></span>
        <span class="pill">LIMIT 時限 <b>${threshold} min</b></span>
        <button class="ghostbtn" data-act="manual">Manual Entry 手動輸入</button>
      </div>`;
  }
  function showChoice(st){
    state='choice';pendingSt=st;const sc=scenarioMeta(scenario);clearTimeout(resetT);resetT=setTimeout(toReady,90000);
    board.innerHTML=`
      <div class="micro">SELECT ACTION · 選擇操作</div>
      <div class="grid2">${houseBlock(st)}<div class="info">${rows(st)}${flagBadge(st)}</div></div>
      <div class="act">
        <button class="bigbtn out" data-act="out">${sc.out.en}<span>${sc.out.zh} · 離開</span></button>
        <button class="bigbtn in" data-act="in">${sc.in.en}<span>${sc.in.zh} · 返回</span></button>
      </div>
      <button class="ghostbtn" data-act="cancel" style="justify-self:center">Cancel 取消</button>`;
    tone(880,.08);
  }
  function showOut(st,count,wasFlag){
    state='out';pendingSt=null;const sc=scenarioMeta(scenario);
    board.innerHTML=`
      <div class="stamp s-out">OUT</div>
      <div class="micro">GOING ${sc.out.en} ${sc.out.zh} · RECORDED 已記錄</div>
      <div class="grid2">${houseBlock(st)}<div class="info">${rows(st)}${wasFlag?flagBadge(st):''}</div></div>
      <div class="ready-foot"><span class="pill">TRIP <b>#${count}</b></span><span class="pill mono">${fmtClock(Date.now())}</span></div>
      <div class="foot-hint">Tap anywhere to return 點一下返回</div>`;
    sound('out');schedule(8000);
  }
  function showIn(st,durMs,over){
    state='in';pendingSt=null;const sc=scenarioMeta(scenario);
    board.innerHTML=`
      <div class="stamp s-in">IN</div>
      <div class="micro">BACK ${sc.in.en} ${sc.in.zh} · RECORDED 已記錄</div>
      <div class="grid2">${houseBlock(st)}<div class="info">${rows(st)}
        <div class="dur-line">${fmtDur(durMs)}<span>TIME OUTSIDE 在外時間</span></div></div></div>
      ${over?`<div class="alert">⏱ TIME EXCEEDED · OUT ≥ ${threshold} MIN — 外出時間過長，已作標記</div>`
            :`<div class="okline">✓ RETURNED ON TIME 準時返回</div>`}
      <div class="foot-hint">Tap anywhere to return 點一下返回</div>`;
    sound(over?'warn':'in');schedule(over?12000:8000);
  }
  function showWarn(st,title,zh,live){
    state='warn';pendingSt=null;
    board.innerHTML=`
      <div class="stamp s-warn">!</div>
      <div class="micro">ATTENTION · 請注意</div>
      <div class="grid2">${houseBlock(st)}<div class="info">${rows(st)}
        <div class="warn-title">${title}<span>${zh}</span></div>
        ${live?`<span class="pill mono">OUT since 離開於 ${fmtClock(live.outAt)} · ${fmtDur(Date.now()-live.outAt)}</span>`:''}</div></div>
      <div class="foot-hint">Tap anywhere to return 點一下返回</div>`;
    sound('err');schedule(10000);
  }
  function showNotFound(raw){
    state='warn';pendingSt=null;
    board.innerHTML=`
      <div class="stamp s-warn">?</div>
      <div class="center">
        <div class="nf">NOT FOUND<span>未找到此卡號 / 學生編號</span></div>
        <div class="mono dim" style="margin:10px 0 18px">“${esc(raw)}”</div>
        <button class="ghostbtn" data-act="manual">Manual Entry 手動輸入</button>
      </div>`;
    sound('err');schedule(9000);
  }

  board.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');
    if(b){const a=b.dataset.act;
      if(a==='manual')openPad();
      else if(a==='out'&&pendingSt)doOut(pendingSt);
      else if(a==='in'&&pendingSt)doIn(pendingSt);
      else if(a==='cancel')toReady();
      return;}
    if(state!=='ready'&&state!=='choice')toReady();
  });
});
</script>
</body>
</html>
