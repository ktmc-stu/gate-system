<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gate · 閘口</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1322;--panel:#121e35;--panel2:#0d1729;--line:#25385c;--text:#eef3fb;--dim:#8fa1c5;--faint:#5d6f95;--amber:#ffb224;--green:#37c978;--red:#ff5d55;--blue:#4b8bff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans','Noto Sans TC',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;
 background:radial-gradient(1100px 520px at 88% -12%,rgba(75,139,255,.16),transparent 62%),radial-gradient(900px 520px at -8% 112%,rgba(255,178,36,.12),transparent 60%),var(--ink)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 78%)}
body::after{content:'';position:fixed;left:0;right:0;height:140px;top:-160px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(120,160,255,.06),transparent);animation:sweep 9s linear infinite}
@keyframes sweep{to{transform:translateY(calc(100vh + 320px))}}
.mono{font-family:'IBM Plex Mono',monospace}
.dim{color:var(--dim)}
/* header */
.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(9,15,29,.65)}
.gsign{font-family:Archivo,'Noto Sans TC';font-weight:900;font-size:clamp(19px,2.6vw,27px);letter-spacing:.05em;display:flex;align-items:center;gap:10px}
.gsign b{color:var(--amber)}
.gsign .zh{font-size:.5em;color:var(--dim);font-weight:500;letter-spacing:.2em}
.led{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:led 2s infinite}
@keyframes led{50%{opacity:.4}}
.gmid{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modebadge{font:600 11px 'IBM Plex Mono';letter-spacing:.16em;border:1px solid var(--line);padding:6px 12px;border-radius:99px;color:var(--amber);background:rgba(255,178,36,.08)}
.conn{font:600 11px 'IBM Plex Mono';letter-spacing:.12em;display:flex;align-items:center;gap:7px;color:var(--dim)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.on i{background:var(--green);box-shadow:0 0 8px var(--green)}
.conn.off i{background:var(--red)}
.gright{display:flex;align-items:center;gap:16px}
.nowout{font:600 12px 'IBM Plex Mono';letter-spacing:.1em;color:var(--dim)}
.nowout b{color:var(--amber);font-size:16px}
.clock{font-size:clamp(16px,2vw,22px);font-weight:600;letter-spacing:.08em}
.iconbtn{background:none;border:1px solid var(--line);color:var(--dim);width:40px;height:40px;border-radius:9px;font-size:17px;cursor:pointer;transition:.15s}
.iconbtn:hover{color:var(--text);border-color:var(--amber)}
/* board */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:2}
.board{width:min(980px,96vw);min-height:min(580px,74vh);background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);padding:clamp(22px,4vw,46px);position:relative;display:flex;flex-direction:column;justify-content:center;gap:22px}
.board>*{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.micro{font:600 11px 'IBM Plex Mono';letter-spacing:.3em;color:var(--faint)}
.ready-word{font-family:Archivo,'Noto Sans TC';font-weight:900;font-size:clamp(64px,13vw,150px);line-height:.95;letter-spacing:.02em}
.cursor{display:inline-block;width:.45em;height:.82em;background:var(--amber);margin-left:.1em;animation:blink 1.1s steps(1) infinite;vertical-align:baseline}
@keyframes blink{50%{opacity:0}}
.ready-sub{font-size:clamp(17px,2.4vw,24px);color:var(--dim);font-weight:600}
.ready-sub .zh{font-size:.8em;color:var(--faint);margin-left:8px}
.chev{display:flex;gap:8px;font-size:30px;color:var(--amber)}
.chev span{animation:chev 1.2s infinite}
.chev span:nth-child(2){animation-delay:.15s}.chev span:nth-child(3){animation-delay:.3s}
@keyframes chev{0%,60%,100%{opacity:.15}30%{opacity:1}}
.ready-foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px}
.pill{font:600 12px 'IBM Plex Mono';letter-spacing:.08em;border:1px solid var(--line);border-radius:99px;padding:8px 14px;color:var(--dim)}
.pill b{color:var(--text)}
.ghostbtn{background:none;border:1px dashed var(--line);color:var(--dim);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.ghostbtn:hover{color:var(--amber);border-color:var(--amber)}
/* house + info */
.grid2{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,4vw,40px);align-items:center}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}
.house{width:clamp(140px,20vw,210px);aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 14px 44px rgba(0,0,0,.45);animation:houseIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes houseIn{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.house .hl{font-family:Archivo;font-weight:900;font-size:clamp(78px,12vw,130px);line-height:1}
.house .hs{font:700 clamp(11px,1.4vw,14px)/1 'IBM Plex Mono';letter-spacing:.34em;opacity:.85;margin-top:6px}
.info{display:grid;gap:4px;min-width:0}
.row{display:flex;justify-content:space-between;gap:14px;border-bottom:1px dashed rgba(49,71,114,.6);padding:9px 2px}
.row .k{color:var(--dim);font-size:14px}.row .k i{font-style:normal;color:var(--faint);font-size:.85em;margin-left:6px}
.row .v{font-weight:700;font-size:clamp(16px,2vw,20px);overflow:hidden;text-overflow:ellipsis}
.row .v.small{font-size:14px;color:var(--dim)}
.flagline{margin-top:12px;border:2px solid var(--amber);color:var(--amber);background:rgba(255,178,36,.1);border-radius:10px;padding:11px 14px;font-weight:800;font-size:15px;letter-spacing:.02em;animation:flash 1.2s ease-in-out infinite}
@keyframes flash{50%{opacity:.55}}
.stamp{position:absolute;top:clamp(14px,3vw,30px);right:clamp(16px,3vw,34px);font-family:Archivo;font-weight:900;font-size:clamp(38px,6vw,62px);letter-spacing:.06em;padding:6px 20px;border:6px solid currentColor;border-radius:10px;transform:rotate(-8deg);animation:stampIn .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(2.4);opacity:0}}
.s-out{color:var(--amber)}.s-in{color:var(--green)}.s-warn{color:var(--red)}
.alert{border:2px solid var(--red);background:rgba(255,93,85,.14);color:#ffd9d7;border-radius:12px;padding:15px 18px;font-weight:800;font-size:clamp(15px,2vw,19px);animation:flash 1s infinite}
.okline{color:var(--green);font-weight:700;font-size:15px;letter-spacing:.06em}
.dur-line{font-family:Archivo;font-weight:900;font-size:clamp(30px,4.5vw,46px);margin-top:8px}
.dur-line span{display:block;font:600 12px 'IBM Plex Mono';letter-spacing:.2em;color:var(--dim);margin-top:4px}
.warn-title{font-family:Archivo;font-weight:900;font-size:clamp(24px,3.4vw,36px);color:var(--red);margin-top:6px}
.warn-title span{display:block;font:500 .5em 'Noto Sans TC';color:var(--dim);margin-top:4px}
.nf{font-family:Archivo;font-weight:900;font-size:clamp(28px,4.5vw,46px)}
.nf span{display:block;font-size:.42em;color:var(--dim);font-weight:500;margin-top:8px}
.center{text-align:center;align-items:center}
/* choice buttons */
.act{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
@media(max-width:560px){.act{grid-template-columns:1fr}}
.bigbtn{font-family:Archivo,'Noto Sans TC';font-weight:900;font-size:clamp(30px,4.4vw,44px);letter-spacing:.05em;padding:clamp(20px,3vw,30px);border-radius:14px;border:3px solid;cursor:pointer;transition:transform .12s;background:none}
.bigbtn span{display:block;font-size:.42em;font-weight:700;letter-spacing:.3em;opacity:.8;margin-top:4px}
.bigbtn:active{transform:scale(.97)}
.bigbtn.out{border-color:var(--amber);color:var(--amber);background:rgba(255,178,36,.1)}
.bigbtn.in{border-color:var(--green);color:var(--green);background:rgba(55,201,120,.1)}
.bigbtn.out:hover{background:rgba(255,178,36,.2)}.bigbtn.in:hover{background:rgba(55,201,120,.2)}
.foot-hint{font-size:12px;color:var(--faint);text-align:center;letter-spacing:.1em}
/* hidden scanner input（常態化輸入框：隱藏但永遠保持焦點）*/
#scan{position:fixed;left:6px;bottom:6px;width:2px;height:2px;opacity:.01;border:0;background:transparent;color:transparent}
/* drawer + pad */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,94vw);background:#101b31;border-left:1px solid var(--line);z-index:60;padding:26px;transform:translateX(105%);transition:transform .28s cubic-bezier(.3,1,.4,1);overflow:auto}
.drawer.open{transform:none;box-shadow:-30px 0 80px rgba(0,0,0,.5)}
.drawer h2{font-family:Archivo;font-size:22px;font-weight:800}.drawer h2 span{font-size:.6em;color:var(--dim);font-weight:500;margin-left:8px}
.drawer label{display:block;margin:18px 0 6px;font-size:13px;color:var(--dim);font-weight:600}
.drawer input[type=text]{width:100%;padding:12px;border-radius:9px;border:1px solid #31477a;background:#0c1526;color:var(--text);font-size:15px;outline:none}
.mode{display:flex;gap:10px;border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:10px;cursor:pointer;transition:.15s;align-items:flex-start}
.mode:has(input:checked){border-color:var(--amber);background:rgba(255,178,36,.08)}
.mode input{margin-top:4px;accent-color:var(--amber)}
.mode b{display:block;font-size:14px}.mode span{font-size:12px;color:var(--dim)}
.note{margin-top:18px;font-size:13px;color:var(--dim);border-top:1px dashed var(--line);padding-top:14px}
.drawer-btns{display:flex;gap:10px;margin-top:22px}
.btn{padding:12px 18px;border-radius:9px;border:0;font-weight:800;font-size:14px;cursor:pointer;letter-spacing:.03em}
.btn.primary{background:var(--amber);color:#241a00;flex:1}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--dim)}
.btn.ghost:hover{color:var(--red);border-color:var(--red)}
.xbtn{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(6,10,20,.8);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center}
.overlay.open{display:flex}
.pad{width:min(380px,94vw);background:#121e35;border:1px solid var(--line);border-radius:16px;padding:22px;animation:up .25s ease}
.pad-head{display:flex;justify-content:space-between;align-items:center;font-family:Archivo;font-weight:800;font-size:18px}
.pad-head span{font-size:.65em;color:var(--dim);font-weight:500;margin-left:6px}
.pad-disp{margin:16px 0 4px;background:#0c1526;border:1px solid #31477a;border-radius:9px;min-height:52px;display:flex;align-items:center;padding:0 14px;font-size:24px;letter-spacing:.12em}
.pad-hint{font-size:12px;color:var(--faint);margin-bottom:12px}
.pad-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pad-keys button{padding:16px 0;font-size:20px;font-weight:700;background:#182742;border:1px solid var(--line);color:var(--text);border-radius:10px;cursor:pointer}
.pad-keys button:active{background:var(--amber);color:#241a00}
.pad .go{width:100%;margin-top:12px;padding:15px;border:0;border-radius:10px;background:var(--green);color:#03230f;font-weight:900;font-size:16px;cursor:pointer;letter-spacing:.05em}
</style>
</head>
<body>

<header class="top">
  <div class="gsign"><span class="led"></span>GATE&nbsp;<b id="gShow">—</b><span class="zh">閘口</span></div>
  <div class="gmid"><span class="modebadge" id="modeBadge">—</span><span class="conn" id="conn"><i></i><span id="connTx">…</span></span></div>
  <div class="gright"><span class="nowout">NOW OUT 外出 <b id="nowOut">0</b></span><time class="clock mono" id="clock">--:--:--</time><button class="iconbtn" id="btnSet" title="Settings 設定">⚙</button></div>
</header>

<main><section class="board" id="board"></section></main>

<input id="scan" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true">

<aside class="drawer" id="drawer">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <h2>Gate Settings<span>閘口設定</span></h2><button class="xbtn" id="drawerClose">✕</button>
  </div>
  <label>Gate Name 閘口名稱</label>
  <input type="text" id="gName" maxlength="24" placeholder="e.g. Main Gate">
  <label style="margin-top:22px">Mode 模式</label>
  <label class="mode"><input type="radio" name="gmode" value="dual"><div><b>Dual Mode 雙模式</b><span>One device · choose OUT/IN after swipe 一部裝置，拍卡後手動揀出/入</span></div></label>
  <label class="mode"><input type="radio" name="gmode" value="out"><div><b>OUT Only 只出</b><span>This device handles exits only 本裝置只處理外出</span></div></label>
  <label class="mode"><input type="radio" name="gmode" value="in"><div><b>IN Only 只入</b><span>This device handles returns only 本裝置只處理返回</span></div></label>
  <label class="mode" style="margin-top:16px"><input type="checkbox" id="gSound"><div><b>Sound 聲音提示</b><span>Beep on swipe 拍卡嗶聲</span></div></label>
  <div class="note">Overlong threshold 超時時限：<b><span id="thNote">15</span> min</b>（於 Admin 管理頁設定 set in Admin）</div>
  <div class="drawer-btns"><button class="btn primary" id="saveCfg">Save 儲存</button><button class="btn ghost" data-signout>Sign Out 登出</button></div>
</aside>

<div class="overlay" id="padOv">
  <div class="pad">
    <div class="pad-head"><div>Manual Entry<span>手動輸入</span></div><button class="xbtn" id="padClose">✕</button></div>
    <div class="pad-disp mono" id="padVal">&nbsp;</div>
    <div class="pad-hint">Enter Card No. or Student ID, then Confirm 輸入卡號或學生編號後按確定</div>
    <div class="pad-keys" id="padKeys"></div>
    <button class="go" id="padGo">CONFIRM 確定</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
const CFG_KEY='gate.cfg.v1';
let cfg={name:'Main Gate',mode:'dual',muted:false};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(CFG_KEY)||'{}'))}catch(e){}
window.MUTED=cfg.muted;
let threshold=15, students={}, liveMap={}, state='boot', pendingSt=null, resetT=null, booted=false;
const $=id=>document.getElementById(id), board=$('board');

requireAuth(function init(){
  if(booted)return; booted=true;
  bindSignOut();
  applyHeader(); toReady();
  setInterval(()=>{$('clock').textContent=fmtClock(Date.now())},500);

  db.ref('students').on('value',s=>{students=s.val()||{}; if(state==='ready')renderReady();});
  db.ref('live').on('value',s=>{liveMap=s.val()||{}; $('nowOut').textContent=Object.keys(liveMap).length; if(state==='ready')renderReady();});
  db.ref('.info/connected').on('value',s=>{const on=!!s.val();$('conn').className='conn '+(on?'on':'off');$('connTx').textContent=on?'LIVE 連線':'OFFLINE 離線';});
  watchThreshold(v=>{threshold=v;$('thNote').textContent=v;});

  /* ---- 常態化焦點：拍卡機 = 鍵盤，任何時候打字都收到 ---- */
  const scan=$('scan');
  function focusScan(){ if(!$('padOv').classList.contains('open') && !$('drawer').classList.contains('open')) scan.focus({preventScroll:true}); }
  scan.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();const v=scan.value;scan.value='';handleScan(v);} });
  scan.addEventListener('blur',()=>setTimeout(focusScan,80));
  document.addEventListener('click',()=>setTimeout(focusScan,60));

  /* ---- header / drawer ---- */
  $('btnSet').onclick=()=>{ $('gName').value=cfg.name; document.querySelector(`input[name=gmode][value=${cfg.mode}]`).checked=true; $('gSound').checked=!cfg.muted; $('drawer').classList.add('open'); };
  $('drawerClose').onclick=()=>$('drawer').classList.remove('open');
  $('saveCfg').onclick=()=>{
    cfg.name=$('gName').value.trim()||'Main Gate';
    cfg.mode=document.querySelector('input[name=gmode]:checked').value;
    cfg.muted=!$('gSound').checked; window.MUTED=cfg.muted;
    localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
    applyHeader(); $('drawer').classList.remove('open'); toReady();
  };
  function applyHeader(){
    $('gShow').textContent=cfg.name;
    $('modeBadge').textContent= cfg.mode==='dual' ? 'DUAL 雙模式' : cfg.mode==='out' ? 'OUT ONLY 只出' : 'IN ONLY 只入';
  }

  /* ---- manual pad ---- */
  let padBuf='';
  '123456789CLR0⌫'.split(/(?<=\d)/).join('|').split('|'); // noop guard
  const keys=['1','2','3','4','5','6','7','8','9','CLR','0','⌫'];
  keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.dataset.k=k==='CLR'?'clr':k==='⌫'?'bk':k;$('padKeys').appendChild(b);});
  $('padKeys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
    if(k==='clr')padBuf=''; else if(k==='bk')padBuf=padBuf.slice(0,-1); else if(padBuf.length<24)padBuf+=k; updPad();});
  function updPad(){$('padVal').textContent=padBuf||'\u00a0';}
  function openPad(){padBuf='';updPad();$('padOv').classList.add('open');}
  function closePad(){$('padOv').classList.remove('open');focusScan();}
  $('padClose').onclick=closePad;
  $('padGo').onclick=()=>{const q=padBuf;closePad();if(q)handleScan(q);};
  document.addEventListener('keydown',e=>{ if(!$('padOv').classList.contains('open'))return;
    if(/^[0-9a-zA-Z]$/.test(e.key)&&padBuf.length<24){padBuf+=e.key;updPad();}
    else if(e.key==='Backspace'){padBuf=padBuf.slice(0,-1);updPad();e.preventDefault();}
    else if(e.key==='Enter'){$('padGo').click();}
    else if(e.key==='Escape')closePad();});

  /* ---- 拍卡主流程 ---- */
  function findStudent(q){
    q=String(q||'').trim().toUpperCase(); if(!q)return null;
    if(students[q])return students[q];
    for(const k in students){ if(String(students[k].sid||'').toUpperCase()===q) return students[k]; }
    return null;
  }
  function handleScan(raw){
    raw=String(raw||'').trim(); if(!raw)return;
    const st=findStudent(raw);
    if(!st){showNotFound(raw);return;}
    if(cfg.mode==='out')doOut(st); else if(cfg.mode==='in')doIn(st); else showChoice(st);
  }

  function doOut(st){
    const card=st.card, now=Date.now();
    if(liveMap[card]){showWarn(st,'ALREADY OUT','學生已在外，無需重複拍卡',liveMap[card]);return;}
    const recKey=db.ref('records').push().key;
    db.ref('live/'+card).transaction(cur=>{
      if(cur)return; // 已有外出記錄 → 中止
      return {recordId:recKey,outAt:now,gate:cfg.name};
    }).then(res=>{
      if(!res.committed){showWarn(st,'ALREADY OUT','學生已在外，無需重複拍卡',liveMap[card]||{outAt:now});return;}
      db.ref('records/'+recKey).set({card,sid:st.sid,cls:st.cls,no:st.no,house:st.house,gateOut:cfg.name,outAt:now,gateIn:null,inAt:null,durationSec:null,overlong:false});
      db.ref('counters/'+card+'/outCount').transaction(v=>(v||0)+1).then(r=>{
        showOut(st, r.snapshot.val()||1, !!st.overlongFlag);
      });
    });
  }
  function doIn(st){
    const card=st.card; let captured=null;
    db.ref('live/'+card).transaction(cur=>{
      if(!cur)return; captured=cur; return null; // 清除外出狀態
    }).then(res=>{
      if(!res.committed||!captured){showWarn(st,'NO OUT RECORD','沒有外出記錄 — 學生並非從本系統外出',null);return;}
      const now=Date.now(), durMs=Math.max(0,now-captured.outAt), over=durMs>=threshold*60000;
      const upd={};
      upd['records/'+captured.recordId+'/inAt']=now;
      upd['records/'+captured.recordId+'/gateIn']=cfg.name;
      upd['records/'+captured.recordId+'/durationSec']=Math.round(durMs/1000);
      upd['records/'+captured.recordId+'/overlong']=over;
      if(over)upd['students/'+card+'/overlongFlag']=true;
      db.ref().update(upd).then(()=>showIn(st,durMs,over));
    });
  }

  /* ---- 畫面 ---- */
  const houseBlock=st=>{const m=houseMeta(st.house);
    return `<div class="house" style="background:${m.color};color:${m.text}"><span class="hl">${esc(st.house||'?')}</span><span class="hs">HOUSE 社</span></div>`;};
  const rows=st=>`
    <div class="row"><span class="k">Student ID<i>學生編號</i></span><span class="v mono">${esc(st.sid||'—')}</span></div>
    <div class="row"><span class="k">Class<i>班別</i></span><span class="v">${esc(st.cls||'—')}</span></div>
    <div class="row"><span class="k">Class Number<i>學號</i></span><span class="v">${esc(st.no||'—')}</span></div>
    <div class="row"><span class="k">Card No.<i>卡號</i></span><span class="v mono small">${esc(st.card)}</span></div>`;
  const flagBadge=st=>st.overlongFlag?`<div class="flagline">⚠ PREVIOUSLY OVERLONG 曾外出時間過長</div>`:'';
  function schedule(ms){clearTimeout(resetT);resetT=setTimeout(toReady,ms);}
  function toReady(){state='ready';pendingSt=null;clearTimeout(resetT);renderReady();}
  function renderReady(){
    if(state!=='ready')return;
    const n=Object.keys(liveMap).length;
    board.innerHTML=`
      <div class="micro">GATE TERMINAL · CARD READER ACTIVE 拍卡就緒</div>
      <div class="ready-word">READY<span class="cursor"></span></div>
      <div class="ready-sub">Present student card<span class="zh">請拍卡</span></div>
      <div class="chev"><span>≫</span><span>≫</span><span>≫</span></div>
      <div class="ready-foot">
        <span class="pill">NOW OUT 正在外出 <b>${n}</b></span>
        <span class="pill">LIMIT 時限 <b>${threshold} min</b></span>
        <button class="ghostbtn" data-act="manual">Manual Entry 手動輸入</button>
      </div>`;
  }
  function showChoice(st){
    state='choice';pendingSt=st;clearTimeout(resetT);resetT=setTimeout(toReady,90000);
    board.innerHTML=`
      <div class="micro">SELECT ACTION · 選擇操作</div>
      <div class="grid2">${houseBlock(st)}<div class="info">${rows(st)}${flagBadge(st)}</div></div>
      <div class="act">
        <button class="bigbtn out" data-act="out">OUT<span>出</span></button>
        <button class="bigbtn in" data-act="in">IN<span>入</span></button>
      </div>
      <button class="ghostbtn" data-act="cancel" style="justify-self:center">Cancel 取消</button>`;
    tone(880,.08);
  }
  function showOut(st,count,wasFlag){
    state='out';pendingSt=null;
    board.innerHTML=`
      <div class="stamp s-out">OUT</div>
      <div class="micro">EXIT RECORDED · 已記錄外出</div>
      <div class="grid2">${houseBlock(st)}<div class="info">${rows(st)}${wasFlag?flagBadge(st):''}</div></div>
      <div class="ready-foot"><span class="pill">EXIT <b>#${count}</b></span><span class="pill mono">${fmtClock(Date.now())}</span></div>
      <div class="foot-hint">Tap anywhere to return 點一下返回</div>`;
    sound('out');schedule(8000);
  }
  function showIn(st,durMs,over){
    state='in';pendingSt=null;
    board.innerHTML=`
      <div class="stamp s-in">IN</div>
      <div class="micro">RETURN RECORDED · 已記錄返回</div>
      <div class="grid2">${houseBlock(st)}<div class="info">${rows(st)}
        <div class="dur-line">${fmtDur(durMs)}<span>TIME OUTSIDE 外出時長</span></div></div></div>
      ${over?`<div class="alert">⏱ TIME EXCEEDED · OUT ≥ ${threshold} MIN — 外出時間過長，已作標記</div>`
            :`<div class="okline">✓ RETURNED ON TIME 準時返回</div>`}
      <div class="foot-hint">Tap anywhere to return 點一下返回</div>`;
    sound(over?'warn':'in');schedule(over?12000:8000);
  }
  function showWarn(st,title,zh,live){
    state='warn';pendingSt=null;
    board.innerHTML=`
      <div class="stamp s-warn">!</div>
      <div class="micro">ATTENTION · 請注意</div>
      <div class="grid2">${houseBlock(st)}<div class="info">${rows(st)}
        <div class="warn-title">${title}<span>${zh}</span></div>
        ${live?`<span class="pill mono">OUT since 出咗去 ${fmtClock(live.outAt)} · ${fmtDur(Date.now()-live.outAt)}</span>`:''}</div></div>
      <div class="foot-hint">Tap anywhere to return 點一下返回</div>`;
    sound('err');schedule(10000);
  }
  function showNotFound(raw){
    state='warn';pendingSt=null;
    board.innerHTML=`
      <div class="stamp s-warn">?</div>
      <div class="center">
        <div class="nf">NOT FOUND<span>未找到此卡號 / 學生編號</span></div>
        <div class="mono dim" style="margin:10px 0 18px">“${esc(raw)}”</div>
        <button class="ghostbtn" data-act="manual">Manual Entry 手動輸入</button>
      </div>`;
    sound('err');schedule(9000);
  }

  board.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');
    if(b){const a=b.dataset.act;
      if(a==='manual')openPad();
      else if(a==='out'&&pendingSt)doOut(pendingSt);
      else if(a==='in'&&pendingSt)doIn(pendingSt);
      else if(a==='cancel')toReady();
      return;}
    if(state!=='ready'&&state!=='choice')toReady();
  });
});
</script>
</body>
</html>
