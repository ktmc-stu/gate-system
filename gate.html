<style>
:root{--bg:#081120;--panel:rgba(17,29,54,.88);--panel2:rgba(10,19,36,.92);--line:rgba(148,180,255,.14);--line2:rgba(148,180,255,.3);

*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
html{color-scheme:dark}
body{font-family:'IBM Plex Sans','Noto Sans TC',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;

.conn.on{color:var(--green)}.conn.on i{background:var(--green);box-shadow:0 0 10px var(--green)}
.conn.off{color:var(--red)}.conn.off i{background:var(--red)}
.gright{display:flex;align-items:center;gap:14px}
.nowout{font:600 11px 'IBM Plex Mono';letter-spacing:.12em;color:var(--dim)}
.nowout b{color:var(--amber);font-size:17px;margin-left:4px}
.clock{font-family:'IBM Plex Mono';font-weight:600;font-size:20px;letter-spacing:.06em}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);font-size:17px;cursor:pointer;transition:.2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.iconbtn:hover{color:var(--amber);border-color:rgba(255,178,36,.5);transform:rotate(30deg)}

.board{width:min(1020px,96vw);position:relative;display:flex;flex-direction:column;gap:20px;

.board::before{content:'';position:absolute;top:0;left:10%;right:10%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:.75}
.board>*{position:relative;animation:up .4s cubic-bezier(.2,.8,.3,1) both}

.micro{font:600 11px 'IBM Plex Mono';letter-spacing:.3em;color:var(--faint)}
