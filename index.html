<!DOCTYPE html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="ios-logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GATE">

<title>Gate Pass System 進出記錄系統</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:30px;
 font-family:'IBM Plex Mono',monospace;color:#f2f6ff;
 background:radial-gradient(1100px 550px at 85% -10%,rgba(75,139,255,.18),transparent 60%),radial-gradient(900px 520px at -5% 110%,rgba(255,178,36,.14),transparent 60%),linear-gradient(180deg,#0a1424,#070d18 60%,#081120)}
.logo{width:88px;height:88px;object-fit:contain;border-radius:22px;display:block}
h1{font-family:'Archivo','Noto Sans TC';font-weight:900;font-size:clamp(28px,6vw,52px);letter-spacing:.04em;text-align:center;line-height:1.15}
h1 b{color:#ffb224}
h1 span{display:block;font-size:.3em;color:#6d7ea6;font-weight:400;letter-spacing:.32em;margin-top:12px}
.board{width:min(680px,94vw);border:1px solid rgba(148,180,255,.16);border-radius:24px;overflow:hidden;
 background:linear-gradient(180deg,rgba(17,29,54,.88),rgba(10,19,36,.92));box-shadow:0 30px 80px rgba(2,8,20,.55);backdrop-filter:blur(14px)}
.row{display:flex;align-items:center;gap:18px;padding:22px 28px;border-bottom:1px solid rgba(148,180,255,.1);text-decoration:none;color:inherit;transition:.2s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,178,36,.06)}
.tag{width:12px;height:12px;border-radius:4px;box-shadow:0 0 12px currentColor}
.row .name{font-family:'Archivo','Noto Sans TC';font-weight:900;font-size:22px;letter-spacing:.06em;flex:1}
.row .name span{display:block;font:400 12px 'Noto Sans TC';color:#6d7ea6;letter-spacing:.22em;margin-top:3px}
.row .go{color:#ffb224;font-size:20px;transition:.2s}
.row:hover .go{transform:translateX(6px)}
p.note{font-size:12px;color:#6d7ea6;text-align:center;max-width:620px;line-height:1.8}
.lockbtn{position:fixed;top:14px;right:14px;z-index:50;background:rgba(255,255,255,.05);border:1px solid rgba(148,180,255,.25);color:#a5b4d4;border-radius:99px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer}
.lockbtn:hover{color:#ffb224;border-color:#ffb224}
</style>
</head>
<body>
<button class="lockbtn" data-signout>🔒 Lock 鎖定</button>
<img class="logo" src="logo.png" onerror="this.style.display='none'" alt="">
<h1>G<b>A</b>TE PASS SYSTEM<span>陸運會・水運會 封閉區進出記錄</span></h1>
<div class="board">
  <a class="row" href="gate.html"><span class="tag" style="color:#ffb224;background:#ffb224"></span><span class="name">GATE<span>閘口 · 掃 QR／手動輸入（免密碼）</span></span><span class="go">≫</span></a>
  <a class="row" href="admin.html"><span class="tag" style="color:#4b8bff;background:#4b8bff"></span><span class="name">ADMIN<span>管理 · 場景／匯入匯出</span></span><span class="go">≫</span></a>
  <a class="row" href="enquiry.html"><span class="tag" style="color:#2fd37f;background:#2fd37f"></span><span class="name">ENQUIRY<span>老師查詢</span></span><span class="go">≫</span></a>
</div>
<p class="note">This page requires the shared staff password 本頁需輸入共用密碼 · Gate 閘口頁免密碼 · Data stored in Firebase Realtime Database</p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
requireAuth(function(){ bindSignOut(); });
</script>
</body>
</html>
