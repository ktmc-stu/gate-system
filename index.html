<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:30px;
 font-family:'IBM Plex Mono',monospace;color:#f2f6ff;
 background:radial-gradient(1100px 550px at 85% -10%,rgba(75,139,255,.18),transparent 60%),radial-gradient(900px 520px at -5% 110%,rgba(255,178,36,.14),transparent 60%),linear-gradient(180deg,#0a1424,#070d18 60%,#081120)}
h1{font-family:'Archivo','Noto Sans TC';font-weight:900;font-size:clamp(30px,6vw,54px);letter-spacing:.04em;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
h1::before{content:'G';display:grid;place-items:center;width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#ffb224,#ff8a3d);
 color:#241500;font-size:40px;box-shadow:0 16px 44px rgba(255,150,40,.4)}
h1 b{color:#ffb224}
h1 span{font-size:.3em;color:#6d7ea6;font-weight:400;letter-spacing:.32em}
.board{width:min(680px,94vw);border:1px solid rgba(148,180,255,.16);border-radius:24px;overflow:hidden;
 background:linear-gradient(180deg,rgba(17,29,54,.88),rgba(10,19,36,.92));box-shadow:0 30px 80px rgba(2,8,20,.55);backdrop-filter:blur(14px)}
.row{display:flex;align-items:center;gap:18px;padding:22px 28px;border-bottom:1px solid rgba(148,180,255,.1);text-decoration:none;color:inherit;transition:.2s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,178,36,.06)}
.tag{width:12px;height:12px;border-radius:4px;box-shadow:0 0 12px currentColor}
.row .name{font-family:'Archivo','Noto Sans TC';font-weight:900;font-size:22px;letter-spacing:.06em;flex:1}
.row .name span{display:block;font:400 12px 'Noto Sans TC';color:#6d7ea6;letter-spacing:.22em;margin-top:3px}
.row .go{color:#ffb224;font-size:20px;transition:.2s}
.row:hover .go{transform:translateX(6px)}
p.note{font-size:12px;color:#6d7ea6;text-align:center;max-width:620px;line-height:1.8}
</style>
</head>
